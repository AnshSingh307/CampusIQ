services:
  - type: web
    name: campusiq-public-demo
    runtime: static
    buildCommand: npm run build:public-demo
    staticPublishPath: ./dist/public-demo
    envVars:
      - key: PUBLIC_DEMO_MODE
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Cache-Control
        value: no-store
